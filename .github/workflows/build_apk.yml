# Konum: depoda  .github/workflows/build.yml
name: Etimokart derle (APK / AAB)
on:
  workflow_dispatch:
    inputs:
      tur:
        description: "Ne derlensin?"
        type: choice
        options: [apk, aab]
        default: apk

jobs:
  apk:
    if: ${{ inputs.tur == 'apk' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buildozer ile APK derle (test için)
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: etimokart-apk
          path: bin/*.apk

  aab:
    if: ${{ inputs.tur == 'aab' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Anahtar dosyasını (keystore) hazırla
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
      - name: Buildozer ile imzalı AAB derle (Google Play için)
        uses: ArtemSBulgakov/buildozer-action@v1
        env:
          P4A_RELEASE_KEYSTORE: /github/workspace/release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        with:
          command: buildozer android release
          buildozer_version: stable
      - uses: actions/upload-artifact@v4
        with:
          name: etimokart-aab
          path: bin/*.aab
