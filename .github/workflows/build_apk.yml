name: Android derle (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketleri
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Buildozer kurulumu
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer "cython==0.29.37"

      # 1) Test için debug APK (imzasız sorun çıkarmaz, telefona doğrudan kurulur)
      - name: Debug APK derle
        run: buildozer -v android debug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: etimokart-apk
          path: bin/*.apk

      # 2) Play Store için imzalı AAB
      - name: Keystore hazırla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Release AAB derle
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -f bin/*.apk
          buildozer -v android release

      - name: AAB'yi yükle
        uses: actions/upload-artifact@v4
        with:
          name: etimokart-aab
          path: bin/*.aab
